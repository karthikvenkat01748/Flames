name: "Private key in build log POC"

on:
  workflow_dispatch:
    inputs:
      test_case:
        description: "Test case to run"
        required: true
        default: private-key
        type: choice
        options:
          - all
          - private-key

permissions:
  contents: read

jobs:
  # Disposable EC private key printed to the build log.
  private-key:
    name: "Private key in build log"
    if: inputs.test_case == 'all' || inputs.test_case == 'private-key'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Generate and print a dummy private key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT

          openssl genpkey \
            -algorithm EC \
            -pkeyopt ec_paramgen_curve:prime256v1 \
            -pkeyopt ec_param_enc:named_curve \
            -out "$key_file"

          echo "Private key content (freshly generated dummy, NOT a real credential):"
          cat "$key_file"
          echo "| private-key | dummy EC key printed to log | check dashboard for secret detection |" >> "$GITHUB_STEP_SUMMARY"
